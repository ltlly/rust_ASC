name: Release Windows Static CRT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset_name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            asset_name: rust_ASC-windows-x86_64.exe
          - target: i686-pc-windows-msvc
            asset_name: rust_ASC-windows-x86.exe
          - target: aarch64-pc-windows-msvc
            asset_name: rust_ASC-windows-aarch64.exe
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage raw release binary
        shell: bash
        run: |
          mkdir -p release-assets
          cp "target/${{ matrix.target }}/release/rust_ASC.exe" "release-assets/${{ matrix.asset_name }}"

      - name: Upload raw release binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release-assets/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 1
